sonar.projectKey=ioms
sonar.projectName=IOMS - Inventory & Order Management System
sonar.projectVersion=1.0

sonar.sources=app,public,views,config,scripts
sonar.tests=tests
sonar.exclusions=public/uploads/**,vendor/**,build/**
sonar.sourceEncoding=UTF-8

sonar.php.coverage.reportPaths=build/coverage/clover.xml
sonar.php.tests.reportPath=build/coverage/junit.xml

# php:S2003 (prefer require_once) does not fit these files: view templates and
# partials are intentionally re-included on every render, and `$x = require 'config.php'`
# needs the file's return value, which require_once only yields on the first call.
sonar.issue.ignore.multicriteria=s2003a,s2003b,s2003c,s2003d,s2003e
sonar.issue.ignore.multicriteria.s2003a.ruleKey=php:S2003
sonar.issue.ignore.multicriteria.s2003a.resourceKey=views/**
sonar.issue.ignore.multicriteria.s2003b.ruleKey=php:S2003
sonar.issue.ignore.multicriteria.s2003b.resourceKey=app/Core/View.php
sonar.issue.ignore.multicriteria.s2003c.ruleKey=php:S2003
sonar.issue.ignore.multicriteria.s2003c.resourceKey=public/index.php
sonar.issue.ignore.multicriteria.s2003d.ruleKey=php:S2003
sonar.issue.ignore.multicriteria.s2003d.resourceKey=app/Controller/ProductController.php
sonar.issue.ignore.multicriteria.s2003e.ruleKey=php:S2003
sonar.issue.ignore.multicriteria.s2003e.resourceKey=scripts/**
