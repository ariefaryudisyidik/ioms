services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ioms-app:local
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      # MySQL runs on the host via MAMP, not as a Docker service; from
      # inside the container, the host is reached via this Docker
      # Desktop-provided hostname (Mac/Windows only).
      DB_HOST: host.docker.internal
      DB_PORT: "3306"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www/html
      - uploads_data:/var/www/html/public/uploads

volumes:
  uploads_data:
